<style>
  :root{
    --bg: #0b2e26;
    --panel: #ffffff;
    --ink: #16241f;
    --ink-soft: #4c5c56;
    --border: #e3ddcb;
    --ok: #1f7a4d;
    --shadow: 0 20px 50px -20px rgba(11,46,38,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:var(--panel);border-radius:20px;padding:40px 32px;
    max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow);
  }
  .icon{
    width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;margin:0 auto 20px;
  }
  h1{font-size:1.4rem;margin:0 0 10px;}
  p{color:var(--ink-soft);margin:0 0 6px;line-height:1.5;}
  .note{margin-top:16px;font-size:.85rem;color:var(--ink-soft);}
</style>

<div class="card">
  <div class="icon">&#10003;</div>
